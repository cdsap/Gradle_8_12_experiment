name: Build

on:
  push:
    branches:
      - test_timeout_gradle_daemon
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_apk:
    name: "Local tests and APKs"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      security-events: write

    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check spotless
        run: |
          bash assemble.sh
        continue-on-error: true

      - name: Upload Gradle Daemon Logs
        if: always() # Ensure this step runs even if the build fails or times out
        uses: actions/upload-artifact@v3
        with:
            name: gradle-daemon-logs
            path: daemon-log-backup.log
